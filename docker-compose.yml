version: '3.8'

networks:
  stock-pipeline-net:
    name: stock-pipeline-net
    driver: bridge

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  kafka_data:
    driver: local

services:
  # ------------------------------------------------------------
  # 1. MinIO Object Storage (Bronze / Silver / Gold / Checkpoints)
  # ------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: sp500-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - stock-pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------
  # 2. MinIO Initialization (Bucket & Bronze Data Setup)
  # ------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sp500-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stock-data}
    volumes:
      - ./minio/init/init_buckets.sh:/init_buckets.sh:ro
      - ./data:/data:ro
    entrypoint: ["/bin/sh", "/init_buckets.sh"]
    networks:
      - stock-pipeline-net

  # ------------------------------------------------------------
  # 3. Apache Kafka (KRaft Mode - No Zookeeper)
  # ------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.0
    container_name: sp500-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L622nShTUiBENbxnSMB3g"
    networks:
      - stock-pipeline-net
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  # ------------------------------------------------------------
  # 4. Kafka Topic Initialization
  # ------------------------------------------------------------
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: sp500-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock-market-data}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    volumes:
      - ./kafka/init/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    networks:
      - stock-pipeline-net

  # ------------------------------------------------------------
  # 5. Kafka UI (Topic & Partition Monitor)
  # ------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sp500-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8082}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sp500-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - stock-pipeline-net
    restart: always

  # ------------------------------------------------------------
  # 6. PostgreSQL (Serving Layer & Airflow Metadata)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sp500-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - stock-pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ------------------------------------------------------------
  # 7. Python Historical Producer (Replay Streaming Simulation)
  # ------------------------------------------------------------
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: sp500-producer:1.0
    container_name: sp500-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock-market-data}
      PRODUCER_DATA_PATH: /data/sp500_stocks.csv
      PRODUCER_RATE: ${PRODUCER_RATE:-100}
      PRODUCER_MAX_RECORDS: ${PRODUCER_MAX_RECORDS:-5000}
      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE:-50}
      REPLAY_START_TIME: ${REPLAY_START_TIME:-2000-01-01T00:00:00}
      REPLAY_INTERVAL_SECONDS: ${REPLAY_INTERVAL_SECONDS:-1}
    volumes:
      - ./data:/data:ro
    networks:
      - stock-pipeline-net
    restart: on-failure

  # ------------------------------------------------------------
  # 8. Apache Spark Runtime (Batch & Streaming)
  # ------------------------------------------------------------
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: sp500-spark:3.5.6
    container_name: sp500-spark
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock-market-data}
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stock_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      WINDOW_DURATION: ${WINDOW_DURATION:-5 minutes}
      WATERMARK_DURATION: ${WATERMARK_DURATION:-10 minutes}
    volumes:
      - ./spark/apps:/app/apps
      - ./data:/data:ro
      - ./tests:/app/tests
      - ./producer:/app/producer:ro
      - ./spark:/app/spark:ro
    command: ["python3", "/app/apps/server.py"]
    restart: unless-stopped
    networks:
      - stock-pipeline-net

  # ------------------------------------------------------------
  # 9. Apache Airflow (Orchestration & Quality Gates)
  # ------------------------------------------------------------
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: sp500-airflow:2.10.0
    container_name: sp500-airflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stock_analytics}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stock_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/data:ro
      - ./spark/apps:/app/apps:ro
    command: ["standalone"]
    networks:
      - stock-pipeline-net
    restart: always
